<body>
<script>
/* GitHub Pages cannot send X-Frame-Options, so refuse to be framed from here */
if (window.top !== window.self) { window.top.location = window.self.location.href; }
</script>

<div class="grain" aria-hidden="true"></div>
<div class="cursor" id="cursor" aria-hidden="true"></div>

<header class="nav" id="nav">
  <a class="logo" href="#/">ZUHAIRS<span>BARBERSHOP</span></a>
  <nav class="navlinks">
    <a href="#/#services" data-i="navServices">מחירון</a>
    <a href="#/#hours" data-i="navHours">שעות</a>
    <a href="#/#visit" data-i="navVisit">איפה</a>
  </nav>
  <button class="lang" id="langBtn">EN</button>
  <a class="cta" href="#/book" data-i="book">הזמן תור</a>
</header>

<!-- ===================== THE SHOP ===================== -->
<main id="home">

  <section class="hero">
    <div class="hero-inner">
      <p class="eyebrow" id="eyebrow"><span class="dot"></span><span id="openState">&nbsp;</span></p>
      <h1 class="title" aria-label="Zuhairs Barbershop">
        <span class="line" data-text="ZUHAIRS"></span>
        <span class="line thin" data-text="BARBERSHOP"></span>
      </h1>
      <p class="lede" id="tagline">מספרה בירושלים</p>
      <div class="hero-actions">
        <a class="btn solid" href="#/book" data-i="bookNow">הזמנת תור</a>
        <a class="btn line-btn" id="waBtn" href="#" data-i="whatsapp">וואטסאפ</a>
      </div>
    </div>
    <div class="scrollcue" aria-hidden="true"><span></span></div>
  </section>

  <div class="pole" aria-hidden="true"></div>

  <div class="marquee" aria-hidden="true"><div class="marquee-track" id="marquee"></div></div>

  <section class="section" id="shots">
    <h2 class="kicker reveal" data-i="galleryKicker">מהמספרה</h2>
    <div class="shots" id="gallery"></div>
  </section>

  <section class="section about reveal" id="about">
    <div class="grid">
      <div class="col-num">
        <span class="bignum" id="years">6</span>
        <span class="numlabel" data-i="yearsLabel">שנות ניסיון</span>
      </div>
      <div class="col-text">
        <h2 class="kicker" data-i="aboutKicker">על המספרה</h2>
        <p class="big" id="about-text"></p>
      </div>
    </div>
  </section>

  <section class="section services" id="services">
    <h2 class="kicker reveal" data-i="servicesKicker">מחירון</h2>
    <div class="rows" id="services-list"></div>
    <p class="fineprint reveal" data-i="pricesNote">המחירים מתעדכנים מעת לעת. התשלום במספרה.</p>
  </section>

  <section class="section reviews" id="reviews">
    <h2 class="kicker reveal" data-i="reviewsKicker">מה אומרים</h2>
    <div class="revgrid" id="reviews-list"></div>
  </section>

  <section class="section hours" id="hours">
    <h2 class="kicker reveal" data-i="hoursKicker">שעות פתיחה</h2>
    <div class="hourgrid" id="hours-list"></div>
  </section>

  <section class="section visit" id="visit">
    <h2 class="kicker reveal" data-i="visitKicker">איפה אנחנו</h2>
    <p class="address reveal" id="address"></p>
    <div class="linkrow reveal">
      <a class="btn line-btn" id="mapsBtn" href="#" data-i="maps">ניווט</a>
      <a class="btn line-btn" id="telBtn" href="#" data-i="call">התקשרו</a>
      <a class="btn line-btn" id="igBtn" href="#" data-i="instagram">Instagram</a>
    </div>
    <p class="fineprint reveal" id="policy"></p>
  </section>

  <section class="closer">
    <h2 class="closer-title reveal" data-i="closer">כיסא אחד.<br>תור אחד.</h2>
    <a class="btn solid big" href="#/book" data-i="bookNow">הזמנת תור</a>
  </section>

</main>

<!-- ===================== BOOKING + STAFF ===================== -->
<main class="app wide hide" id="view"></main>

<footer class="foot">
  <span>Zuhairs Barbershop</span>
  <a href="#/staff" data-i="staff">כניסת צוות</a>
</footer>

<a class="sticky-cta" href="#/book" data-i="book">הזמן תור</a>

<script type="module" src="../app.js?v=20260731162826"></script>
</body>
</html>
